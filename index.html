<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 따릉이 대여소 현황</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- 헤더 영역 -->
        <header class="bg-white rounded-2xl shadow-sm p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-extrabold text-green-600 flex items-center gap-2">
                    🚲 서울 따릉이 현황
                    <span id="sampleBadge" class="hidden text-xs font-semibold bg-orange-100 text-orange-600 px-2 py-1 rounded-full">
                        샘플 데이터
                    </span>
                </h1>
                <p id="lastUpdated" class="text-sm text-gray-500 mt-1">마지막 갱신: -</p>
            </div>
            
            <div class="flex items-center gap-2 w-full md:w-auto">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="대여소 이름 검색..." 
                    class="flex-1 md:w-64 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all"
                >
                <button 
                    id="sortBtn" 
                    class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold transition-colors flex-shrink-0"
                >
                    자전거 많은 순
                </button>
                <button 
                    id="refreshBtn" 
                    class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-semibold transition-colors flex-shrink-0"
                >
                    새로고침
                </button>
            </div>
        </header>

        <!-- 로딩 표시기 -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block w-8 h-8 border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-2 text-gray-600 font-medium">데이터를 불러오는 중입니다...</p>
        </div>

        <!-- 대여소 리스트 -->
        <main id="stationList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- 자바스크립트를 통해 아이템이 이곳에 렌더링됩니다 -->
        </main>
        
        <!-- 검색 결과 없음 -->
        <div id="noResult" class="hidden text-center py-12 bg-white rounded-2xl shadow-sm">
            <p class="text-gray-500 text-lg">검색된 대여소가 없습니다.</p>
        </div>
    </div>

    <script>
        // 샘플 데이터
        const SAMPLE_DATA = {
            "rentBikeStatus": {
                "list_total_count": 5,
                "RESULT": {"CODE": "INFO-000", "MESSAGE": "정상 처리되었습니다."},
                "row": [
                    {"rackTotCnt": "15", "stationName": "102. 망원역 1번출구 앞", "parkingBikeTotCnt": "13", "shared": "87", "stationLatitude": "37.55564880", "stationLongitude": "126.91062927", "stationId": "ST-4"},
                    {"rackTotCnt": "14", "stationName": "103. 망원역 2번출구 앞", "parkingBikeTotCnt": "14", "shared": "100", "stationLatitude": "37.55495071", "stationLongitude": "126.91083527", "stationId": "ST-5"},
                    {"rackTotCnt": "13", "stationName": "104. 합정역 1번출구 앞", "parkingBikeTotCnt": "1", "shared": "8", "stationLatitude": "37.55073929", "stationLongitude": "126.91508484", "stationId": "ST-6"},
                    {"rackTotCnt": "5", "stationName": "105. 합정역 5번출구 앞", "parkingBikeTotCnt": "1", "shared": "20", "stationLatitude": "37.55000687", "stationLongitude": "126.91482544", "stationId": "ST-7"},
                    {"rackTotCnt": "12", "stationName": "106. 합정역 7번출구 앞", "parkingBikeTotCnt": "0", "shared": "92", "stationLatitude": "37.54864502", "stationLongitude": "126.91282654", "stationId": "ST-8"} // 테스트를 위해 0대인 상황 하나 추가 (원래 11대)
                ]
            }
        };

        // DOM 요소
        const searchInput = document.getElementById('searchInput');
        const sortBtn = document.getElementById('sortBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const stationList = document.getElementById('stationList');
        const lastUpdatedTxt = document.getElementById('lastUpdated');
        const sampleBadge = document.getElementById('sampleBadge');
        const loadingIndicator = document.getElementById('loading');
        const noResultIndicator = document.getElementById('noResult');

        // 전역 상태
        let currentStations = [];
        let isSortedDesc = false;

        // 즐겨찾기 상태 불러오기
        function getFavorites() {
            const favs = localStorage.getItem('bikeFavorites');
            return favs ? JSON.parse(favs) : [];
        }

        // 즐겨찾기 토글 함수 (전역)
        window.toggleFavorite = function(stationId) {
            let favs = getFavorites();
            if (favs.includes(stationId)) {
                favs = favs.filter(id => id !== stationId); // 해제
            } else {
                favs.push(stationId); // 추가
            }
            localStorage.setItem('bikeFavorites', JSON.stringify(favs));
            renderStations(currentStations); // 화면 즉시 갱신
        };

        // 데이터 렌더링 함수
        function renderStations(stations) {
            const query = searchInput.value.toLowerCase().trim();
            let filtered = stations.filter(station => 
                station.stationName.toLowerCase().includes(query)
            );
            
            const favorites = getFavorites();

            // 1. 자전거 많은 순 정렬
            if (isSortedDesc) {
                filtered.sort((a, b) => parseInt(b.parkingBikeTotCnt, 10) - parseInt(a.parkingBikeTotCnt, 10));
            }

            // 2. 즐겨찾기 한 곳을 맨 위로 올림 (내부 정렬 순서는 유지)
            filtered.sort((a, b) => {
                const aFav = favorites.includes(a.stationId);
                const bFav = favorites.includes(b.stationId);
                if (aFav && !bFav) return -1;
                if (!aFav && bFav) return 1;
                return 0;
            });

            stationList.innerHTML = '';

            if (filtered.length === 0) {
                noResultIndicator.classList.remove('hidden');
                stationList.classList.add('hidden');
                return;
            }

            noResultIndicator.classList.add('hidden');
            stationList.classList.remove('hidden');

            const html = filtered.map(station => {
                // 문자열을 숫자로 변환
                const bikes = parseInt(station.parkingBikeTotCnt, 10);
                const racks = parseInt(station.rackTotCnt, 10);
                const shared = parseInt(station.shared, 10);
                
                const isZero = bikes === 0;

                // 0대일 경우 빨간색 스타일 적용
                const cardStyle = isZero 
                    ? 'bg-red-50 border-red-300 shadow-red-100' 
                    : 'bg-white border-gray-200 hover:border-green-300';
                
                const titleStyle = isZero ? 'text-red-700' : 'text-gray-800';
                const countStyle = isZero ? 'text-red-600' : 'text-green-600';
                const labelStyle = isZero ? 'text-red-500' : 'text-gray-500';

                // 즐겨찾기 상태에 따른 아이콘 스타일
                const isFav = favorites.includes(station.stationId);
                const starColor = isFav 
                    ? 'text-yellow-400 fill-current' 
                    : 'text-gray-300 hover:text-yellow-400 fill-transparent';

                // 거치율 프로그레스 바 색상 및 너비 설정
                let barColor = 'bg-blue-400';
                if (shared === 0) barColor = 'bg-red-500';
                else if (shared >= 100) barColor = 'bg-green-500';
                
                // 최대 너비를 100%로 제한
                const clampedShared = Math.min(shared, 100);

                return `
                    <div class="border rounded-2xl p-5 shadow-sm transition-all duration-200 flex flex-col justify-between h-full ${cardStyle}">
                        <div class="flex justify-between items-start mb-4 gap-2">
                            <h3 class="font-bold text-lg leading-tight ${titleStyle}">${station.stationName}</h3>
                            <div class="flex items-center gap-1 flex-shrink-0">
                                <a href="https://map.kakao.com/link/map/${encodeURIComponent(station.stationName)},${station.stationLatitude},${station.stationLongitude}" target="_blank" rel="noopener noreferrer" class="p-1 text-gray-400 hover:text-blue-500 transition-colors" title="지도 보기">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    </svg>
                                </a>
                                <button onclick="toggleFavorite('${station.stationId}')" class="p-1 focus:outline-none transition-colors duration-200" title="즐겨찾기">
                                    <svg class="w-7 h-7 ${starColor}" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        
                        <div class="mt-auto pt-2">
                            <div class="flex justify-between items-end mb-2">
                                <div class="space-y-1 flex flex-col items-start">
                                    <p class="text-xs text-gray-500 bg-gray-100/50 px-2 py-1 rounded">거치대: <span class="font-semibold text-gray-700">${racks}</span>개</p>
                                    <p class="text-xs text-gray-500 bg-gray-100/50 px-2 py-1 rounded">거치율: <span class="font-semibold text-gray-700">${shared}</span>%</p>
                                </div>
                                <div class="text-right flex-shrink-0">
                                    <span class="text-4xl font-black ${countStyle}">${bikes}</span>
                                    <span class="text-sm font-medium ${labelStyle}">대</span>
                                </div>
                            </div>
                            <!-- 거치율 막대 그래프 -->
                            <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
                                <div class="${barColor} h-1.5 rounded-full transition-all duration-500" style="width: ${clampedShared}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            stationList.innerHTML = html;
        }

        // 시간 포맷팅 함수
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ko-KR', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            lastUpdatedTxt.textContent = `마지막 갱신: ${timeString}`;
        }

        // 데이터 Fetch 함수
        async function fetchBikeData() {
            // UI 초기화 (로딩)
            stationList.innerHTML = '';
            loadingIndicator.classList.remove('hidden');
            noResultIndicator.classList.add('hidden');
            refreshBtn.disabled = true;
            refreshBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const response = await fetch('/api/bike');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data && data.rentBikeStatus && data.rentBikeStatus.row) {
                    currentStations = data.rentBikeStatus.row;
                    sampleBadge.classList.add('hidden'); // 성공시 샘플 뱃지 숨김
                } else {
                    throw new Error("Invalid data format");
                }
            } catch (error) {
                console.warn('API 호출 실패. 샘플 데이터를 사용합니다.', error);
                // 실패 시 샘플 데이터 사용
                currentStations = SAMPLE_DATA.rentBikeStatus.row;
                sampleBadge.classList.remove('hidden'); // 실패시 샘플 뱃지 표시
                sampleBadge.classList.add('inline-block');
            } finally {
                // UI 갱신 (로딩 종료)
                loadingIndicator.classList.add('hidden');
                refreshBtn.disabled = false;
                refreshBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                
                updateTime();
                renderStations(currentStations);
            }
        }

        // 이벤트 리스너 등록
        sortBtn.addEventListener('click', () => {
            isSortedDesc = !isSortedDesc;
            
            // 버튼 텍스트 및 색상 변경
            if (isSortedDesc) {
                sortBtn.textContent = '기본 정렬';
                sortBtn.classList.replace('bg-blue-500', 'bg-blue-700');
                sortBtn.classList.replace('hover:bg-blue-600', 'hover:bg-blue-800');
            } else {
                sortBtn.textContent = '자전거 많은 순';
                sortBtn.classList.replace('bg-blue-700', 'bg-blue-500');
                sortBtn.classList.replace('hover:bg-blue-800', 'hover:bg-blue-600');
            }
            
            renderStations(currentStations);
        });

        refreshBtn.addEventListener('click', fetchBikeData);
        
        searchInput.addEventListener('input', () => {
            renderStations(currentStations);
        });

        // 초기 데이터 로드
        fetchBikeData();
    </script>
</body>
</html>
